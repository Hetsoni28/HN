<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 735" width="830" height="735" fill="none" role="img" aria-label="HN Studio Logo">
  <defs>
    <!-- Left Pillar Gradients -->
    <linearGradient id="hn-left-base" x1="116" y1="115" x2="266" y2="679" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2A3E" />
      <stop offset="40%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#070C15" />
    </linearGradient>
    <linearGradient id="hn-left-bevel" x1="116" y1="220" x2="140" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3D5370" />
      <stop offset="100%" stop-color="#141E2D" />
    </linearGradient>

    <!-- Middle Pillar Gradients -->
    <linearGradient id="hn-mid-base" x1="361" y1="200" x2="489" y2="692" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#172235" />
      <stop offset="50%" stop-color="#0C1422" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>
    <linearGradient id="hn-mid-bevel" x1="361" y1="400" x2="385" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#31455E" />
      <stop offset="100%" stop-color="#0E1624" />
    </linearGradient>

    <!-- Top Fin Gradients -->
    <linearGradient id="hn-top-fin" x1="361" y1="40" x2="520" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="35%" stop-color="#0088FF" />
      <stop offset="70%" stop-color="#00BAFF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>

    <!-- Right Pillar Gradients -->
    <linearGradient id="hn-right-facet" x1="663" y1="200" x2="695" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0035A0" />
      <stop offset="100%" stop-color="#004AD6" />
    </linearGradient>
    <linearGradient id="hn-right-front" x1="695" y1="100" x2="790" y2="705" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0099FF" />
      <stop offset="30%" stop-color="#0066FF" />
      <stop offset="70%" stop-color="#004AE0" />
      <stop offset="100%" stop-color="#002D96" />
    </linearGradient>
    <linearGradient id="hn-right-bevel-top" x1="663" y1="205" x2="790" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4D96FF" />
      <stop offset="100%" stop-color="#80B8FF" />
    </linearGradient>
    <linearGradient id="hn-right-edge-highlight" x1="785" y1="100" x2="790" y2="705" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#85C2FF" />
      <stop offset="50%" stop-color="#3888FF" />
      <stop offset="100%" stop-color="#0040C8" />
    </linearGradient>

    <!-- Ribbon / Swoosh Gradients -->
    <linearGradient id="hn-swoosh-main" x1="37" y1="605" x2="770" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="18%" stop-color="#00AAFF" />
      <stop offset="42%" stop-color="#0062FF" />
      <stop offset="70%" stop-color="#004AE8" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>
    <linearGradient id="hn-swoosh-crest" x1="200" y1="360" x2="550" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C4FF" />
      <stop offset="40%" stop-color="#0077FF" />
      <stop offset="100%" stop-color="#003ACC" />
    </linearGradient>
    <linearGradient id="hn-swoosh-shadow" x1="380" y1="300" x2="520" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#001844" />
      <stop offset="60%" stop-color="#02286E" />
      <stop offset="100%" stop-color="#063E9C" />
    </linearGradient>
    <linearGradient id="hn-swoosh-tip" x1="37" y1="605" x2="160" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="60%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Outer Glow / Ambient Lighting Filter -->
    <filter id="hn-ambient-glow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#003399" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. LEFT PILLAR (Left leg of 'H') -->
  <g id="hn-left-pillar">
    <!-- Main faceted body -->
    <path d="M 116 220 L 266 115 L 266 574 L 116 679 Z" fill="url(#hn-left-base)" />
    <!-- Left bevel edge -->
    <path d="M 116 220 L 140 238 L 140 662 L 116 679 Z" fill="url(#hn-left-bevel)" opacity="0.9" />
    <!-- Inner face bevel -->
    <path d="M 140 238 L 244 165 L 244 550 L 140 662 Z" fill="#0C1524" />
    <!-- Right bevel edge -->
    <path d="M 244 165 L 266 115 L 266 574 L 244 550 Z" fill="#1C2B42" opacity="0.6" />
    <!-- Top & bottom bevel trims -->
    <path d="M 116 220 L 266 115 L 244 165 L 140 238 Z" fill="#2E4462" opacity="0.75" />
    <path d="M 116 679 L 266 574 L 244 550 L 140 662 Z" fill="#060C14" opacity="0.8" />
  </g>

  <!-- 2. MIDDLE PILLAR (Center stem of 'H' & 'N') -->
  <g id="hn-middle-pillar">
    <!-- Main faceted body -->
    <path d="M 361 280 L 489 335 L 489 692 L 361 585 Z" fill="url(#hn-mid-base)" />
    <!-- Left bevel edge -->
    <path d="M 361 280 L 383 294 L 383 598 L 361 585 Z" fill="url(#hn-mid-bevel)" opacity="0.9" />
    <!-- Center face -->
    <path d="M 383 294 L 469 344 L 469 676 L 383 598 Z" fill="#0D1626" />
    <!-- Right bevel edge -->
    <path d="M 469 344 L 489 335 L 489 692 L 469 676 Z" fill="#18273E" opacity="0.5" />
    <!-- Bottom point bevel -->
    <path d="M 361 585 L 489 692 L 469 676 L 383 598 Z" fill="#050910" opacity="0.9" />
  </g>

  <!-- 3. TOP-LEFT FIN OF 'N' -->
  <g id="hn-top-fin-shape">
    <!-- Upward triangular fin pointing to (361, 40) -->
    <path d="M 361 40 L 489 160 L 489 240 C 450 236 400 248 361 280 Z" fill="url(#hn-top-fin)" />
    <!-- Inner top highlight sheen -->
    <path d="M 361 40 L 400 77 L 400 255 C 385 262 372 271 361 280 Z" fill="#00C8FF" opacity="0.45" />
  </g>

  <!-- 4. RIGHT PILLAR (Right leg of 'N') -->
  <g id="hn-right-pillar">
    <!-- Left facet (darker blue turn) -->
    <path d="M 663 205 L 695 180 L 695 675 L 663 600 Z" fill="url(#hn-right-facet)" />
    <!-- Main front face -->
    <path d="M 695 180 L 789 100 L 789 705 L 695 675 Z" fill="url(#hn-right-front)" />
    <!-- Top bevel angled edge -->
    <path d="M 663 205 L 789 100 L 783 115 L 695 180 Z" fill="url(#hn-right-bevel-top)" opacity="0.9" />
    <!-- Right highlight border -->
    <path d="M 785 103 L 789 100 L 789 705 L 785 701 Z" fill="url(#hn-right-edge-highlight)" />
    <!-- Bottom facet trim -->
    <path d="M 663 600 L 695 675 L 789 705 L 780 690 Z" fill="#001D6E" opacity="0.8" />
  </g>

  <!-- 5. 3D CURVED CROSSBAR RIBBON (Linking 'H' and 'N') -->
  <g id="hn-swoosh-ribbon">
    <!-- Underside shadow / fold under the crest -->
    <path d="M 361 350 C 400 320 445 320 489 335 L 560 440 C 510 420 460 400 400 405 C 375 407 365 415 361 420 Z" fill="url(#hn-swoosh-shadow)" />

    <!-- Main dynamic curving ribbon (upper surface) -->
    <path d="M 37 608 C 50 560 85 495 138 438 C 210 360 300 285 405 272 C 480 263 540 300 625 410 C 690 495 745 595 789 670 C 785 680 772 688 755 675 C 700 585 640 480 575 402 C 515 330 465 315 410 325 C 320 342 230 420 160 500 C 115 550 78 600 37 608 Z" fill="url(#hn-swoosh-main)" filter="url(#hn-ambient-glow)" />

    <!-- Leading edge highlight on the ribbon (electric cyan top glow) -->
    <path d="M 37 608 C 50 560 85 495 138 438 C 210 360 300 285 405 272 C 480 263 540 300 625 410 C 605 385 550 310 470 290 C 375 268 280 320 180 430 C 120 495 70 560 37 608 Z" fill="url(#hn-swoosh-tip)" opacity="0.9" />

    <!-- Inner crest highlight sheen -->
    <path d="M 280 340 C 340 295 410 275 460 285 C 430 280 370 295 310 335 Z" fill="#FFFFFF" opacity="0.4" />
  </g>
</svg>